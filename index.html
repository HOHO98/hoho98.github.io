/* ---------- 공통: 커버 그래픽 ---------- */
function hubScene(id, c1, c2, kind){
  const g = `<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect width="400" height="150" fill="url(#g${id})"/>`;
  const art = {
    sea:`<circle cx="322" cy="40" r="24" fill="#fff" opacity=".22"/>
      <path d="M0 100 C60 84 110 114 170 102 C230 90 285 114 340 100 C368 93 386 96 400 92 L400 150 L0 150Z" fill="#fff" opacity=".16"/>
      <path d="M0 118 C70 104 120 130 190 120 C250 112 300 130 400 114 L400 150 L0 150Z" fill="#fff" opacity=".26"/>`,
    island:`<circle cx="330" cy="36" r="22" fill="#fff" opacity=".22"/>
      <path d="M0 112 L400 112 L400 150 L0 150Z" fill="#fff" opacity=".2"/>
      <path d="M52 112 C62 84 90 74 108 84 C126 74 152 88 158 112Z" fill="#fff" opacity=".38"/>
      <path d="M196 112 C204 94 224 88 236 96 C248 90 264 100 268 112Z" fill="#fff" opacity=".3"/>
      <path d="M300 112 C308 98 326 94 336 102 C344 98 356 104 360 112Z" fill="#fff" opacity=".24"/>`,
    road:`<path d="M170 40 L230 40 L330 150 L70 150Z" fill="#fff" opacity=".16"/>
      <path d="M198 46 L202 46 L206 66 L194 66Z" fill="#fff" opacity=".55"/>
      <path d="M192 78 L208 78 L214 104 L186 104Z" fill="#fff" opacity=".55"/>
      <path d="M183 116 L217 116 L226 150 L174 150Z" fill="#fff" opacity=".55"/>
      <circle cx="60" cy="42" r="18" fill="#fff" opacity=".2"/>`,
    grid:`<g fill="#fff">
      ${[0,1,2,3,4,5,6].map(c=>[0,1,2].map(r=>
        `<rect x="${34+c*48}" y="${44+r*32}" width="34" height="22" rx="5" opacity="${0.1+((c+r)%3)*0.09}"/>`).join("")).join("")}
      </g><rect x="26" y="26" width="348" height="6" rx="3" fill="#fff" opacity=".3"/>`,
    burst:`<g stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".14">
      ${[0,1,2,3,4,5,6,7].map(i=>{const a=(-95+i*20)*Math.PI/180;
        return `<line x1="330" y1="150" x2="${330+Math.cos(a)*260}" y2="${150+Math.sin(a)*260}"/>`;}).join("")}
      </g><circle cx="330" cy="150" r="46" fill="#fff" opacity=".18"/>`
  }[kind||"sea"];
  return `<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice">${g}${art}</svg>`;
}

function hubCover(b,uid){
  const bg = b.img
    ? `<img src="${esc(b.img)}" alt="${esc(b.title)}" onerror="this.style.display='none'">`
    : hubScene(uid, b.c1||"#0e7c92", b.c2||"#7fd6df", b.scene);
  return `<div class="cover" style="background:${b.c1||'#0e7c92'}">
    ${bg}<div class="cv-sh"></div>
    <div class="cv-em">${b.ic||"🌺"}</div>
    <div class="cv-tx"><b>${esc(b.title)}</b><span>${esc(b.desc||"")}</span></div>
  </div>`;
}


/* ---------- 공통: 목차 허브 → 상세 페이지 빌더 ---------- */
function makeHubPage(el, B, opts){
  B = B || []; opts = opts || {};

  const heroHtml = opts.hero ? `<div class="hero">
      <h2>${esc(opts.hero.title)}</h2><p>${esc(opts.hero.desc)}</p>
      <div class="meta">${(opts.hero.stats||[]).map(s=>
        `<div>${esc(s.label)}<b>${esc(s.value)}</b></div>`).join("")}</div>
    </div>` : "";

  const K = opts.key || "x";

  /* ---- 공통 조각 ---- */
  const secTitle = (t,badge)=>
    `<div class="sec-title"><h2>${esc(t)}</h2><span>${esc(badge||"")}</span></div>`;
  const leadHtml = t => t ? `<p class="lead">${esc(t)}</p>` : "";
  const tiles = list => `<div class="hubgrid">${list.map((b,i)=>
    `<button class="hubcard" data-i="${i}" style="--c1:${b.c1||'#0e7c92'};--c2:${b.c2||'#7fd6df'}">
       <span class="hi">${b.ic||"📄"}</span>
       <span class="ht">${esc(b.short||b.title)}</span>
       <span class="hd">${esc(b.desc||"")}</span>
     </button>`).join("")}</div>`;

  function bodyHtml(b){
    if(b.type==="exp"){
      const faq = !!b.faq;
      const row = i =>
        `<details class="exp${faq?" faq":""}"${i.color?` style="border-left-color:${i.color}"`:""}>
           <summary>
             <span class="${faq?"qb":"ic"}">${faq?"Q":(i.ic||"•")}</span>
             <span class="tt"><b>${esc(i.t)}</b><span>${esc(i.s||"")}</span></span>
             <span class="arw">▾</span>
           </summary>
           <div class="body">${faq
             ? `<div class="ans"><span class="ab">A</span><div class="ac">${i.html||""}</div></div>`
             : (i.html||"")}</div>
         </details>`;
      let out="", last=null, n=0; const chips=[];
      b.items.forEach(i=>{
        if(i.group && i.group!==last){
          last=i.group; n++;
          const gid=K+"g"+n;
          chips.push({id:gid,label:i.group});
          out += `<h3 class="grph" id="${gid}">${esc(i.group)}</h3>`;
        }
        out += row(i);
      });
      const nav = chips.length>1
        ? `<div class="gnav">${chips.map(c=>`<button data-go="${c.id}">${esc(c.label)}</button>`).join("")}</div>`
        : "";
      return nav + out;
    }
    if(b.type==="kv"){
      return `<div class="card">` + b.items.map(i=>
        `<div class="kv"><div class="k">${esc(i.k)}</div>
           <div class="v">${esc(i.v)}${i.s?`<small>${esc(i.s)}</small>`:""}</div></div>`).join("") + `</div>`;
    }
    if(b.type==="notes"){
      return b.items.map(i=>`<div class="note ${i.kind||"tip"}">${i.text}</div>`).join("");
    }
    if(b.type==="season") return seasonChart(b);
    if(b.type==="prep") return prepHtml(b);
    if(b.type==="gallery"){
      return `<div class="gal">${(b.items||[]).map((i,n)=>{
        const g1=i.g1||b.g1||"#0e7c92", g2=i.g2||b.g2||"#7fd6df";
        const thumb = i.img
          ? `<img src="${esc(i.img)}" alt="${esc(i.t)}" loading="lazy" onerror="this.style.display='none'">`
          : galArt(i.art, g1, g2) + `<span class="galbadge">${i.ic||"📷"}</span>`;
        return `<details class="galc" data-gal="${n}">
          <summary>
            <span class="galthumb" style="--g1:${g1};--g2:${g2}">
              ${thumb}
              <span class="galcap"><b>${esc(i.n||i.t)}</b>${i.tag?`<i>${esc(i.tag)}</i>`:""}</span>
            </span>
            ${i.s?`<span class="galsum">${esc(i.s)}</span>`:""}
          </summary>
          <div class="galb">${(i.n&&i.n!==i.t)?`<h4 class="galh">${esc(i.t)}</h4>`:""}${i.html||""}
            ${(i.spots&&i.spots.length)?`<div class="galspots">
              <div class="gl">추천 맛집</div>
              ${i.spots.map(sp=>`<button class="gs" data-spot="${esc(sp)}">
                 <b>${esc(sp)}</b><span class="go">스팟에서 보기 →</span></button>`).join("")}
            </div>`:""}
            ${(i.q&&i.q.length)?`<div class="galq">${i.q.map(k=>
              `<a href="https://www.google.com/search?q=${encodeURIComponent(k+" 沖縄")}"
                 target="_blank" rel="noopener">🔎 ${esc(k)}</a>`).join("")}</div>`:""}
          </div>
        </details>`;}).join("")}</div>`;
    }
    return `<div class="card">${b.html||""}</div>`;
  }

  /* ---- 타일 클릭 연결 (그룹이면 하위 목록으로) ---- */
  function bindTiles(list, selfView){
    $$(".hubcard",el).forEach(c=>{
      const i=+c.dataset.i, b=list[i];
      c.onclick = ()=> (b && b.type==="group")
        ? groupView(b, selfView)
        : detail(list, i, selfView, opts.backLabel||"← 전체 목차");
    });
  }

  /* ---- ① 최상위 목차 ---- */
  function hub(){
    el.innerHTML = heroHtml
      + (opts.video ? ytCard(opts.video) : "")
      + secTitle(opts.title||"목차", opts.badge||(B.length+" TOPICS"))
      + leadHtml(opts.lead)
      + tiles(B);
    bindTiles(B, hub);
    initYt(el);
    top();
  }

  /* ---- ② 그룹(중간) 목차 ---- */
  function groupView(parent, back){
    const kids = parent.blocks || [];
    const isMap = parent.groupMode === "map";
    const regions = kids.map(k=>({ n:k.short||k.title, c:k.c1||"#0e7c92", s:k.desc||"" }));
    const navHtml = isMap
      ? regionMapSvg(regions) +
        `<div class="arealist">${kids.map((k,i)=>
          `<details class="aitem" data-area="${i}" style="--c:${regions[i].c}">
             <summary>
               <span class="an">${i+1}</span>
               <span class="ac"><b>${esc(k.short||k.title)}</b><span>${esc(k.desc||"")}</span></span>
               <span class="aa">›</span>
             </summary>
             <div class="abody">${bodyHtml(k)}</div>
           </details>`).join("")}</div>`
      : tiles(kids);

    el.innerHTML = `<button class="backbtn js-bk">← 전체 목차</button>`
      + hubCover(parent, K+"grp")
      + secTitle(parent.groupTitle||"어느 쪽이 궁금하세요?", parent.groupBadge||"클릭 시 이동")
      + leadHtml(parent.groupLead)
      + navHtml;
    $(".js-bk",el).onclick = back;

    if(isMap){
      const items = $$(".aitem", el);
      const syncPins = ()=>{
        const openIdx = items.findIndex(x=>x.open);
        $$(".rmpin",el).forEach(pn=>pn.classList.toggle("on", +pn.dataset.region===openIdx));
      };
      items.forEach(it=>{
        it.addEventListener("toggle",()=>{
          if(it.open) items.forEach(o=>{ if(o!==it) o.open=false; });
          syncPins();
          if(it.open){
            const ds=$$("details.exp", it);
            ds.forEach(dd=> dd.addEventListener("toggle",()=>{
              if(!dd.open) return;
              ds.forEach(o=>{ if(o!==dd) o.open=false; });
            }));
          }
        });
      });
      const openArea = i=>{
        const t=items[i]; if(!t) return;
        t.open = true;
        if(t.scrollIntoView) t.scrollIntoView({behavior:"smooth",block:"start"});
      };
      $$("[data-region]",el).forEach(n=> n.onclick = ()=> openArea(+n.dataset.region));
      top();
      return;
    }
    const open = i => (kids[i] && kids[i].type==="group")
      ? groupView(kids[i], ()=>groupView(parent, back))
      : detail(kids, i, ()=>groupView(parent, back), "← "+(parent.short||parent.title));
    $$("[data-region]",el).forEach(n=> n.onclick = ()=> open(+n.dataset.region));
    $$(".hubcard",el).forEach(c=> c.onclick = ()=> open(+c.dataset.i));
    top();
  }

  /* ---- ③ 상세 ---- */
  let allOpen = false;
  function detail(list, i, back, backLabel){
    const b = list[i];
    allOpen = false;
    const isExp = b.type==="exp";
    const isSeason = b.type==="season";
    el.innerHTML =
      `<button class="backbtn js-bk">${esc(backLabel||"← 전체 목차")}</button>` +
      hubCover(b, K+i) +
      (b.live ? liveWidget(b.trip) : "") +
      (isExp
        ? `<div class="dtools"><span class="cnt2">👆 항목을 누르면 자세한 설명이 열립니다 · ${b.items.length}개</span>
             <button class="js-exall">전체 펼치기</button></div>`
        : "") +
      bodyHtml(b) +
      `<div class="dnav">
         <button class="js-pv" ${i===0?"disabled":""}>← 이전<b>${i===0?"—":esc(list[i-1].short||list[i-1].title)}</b></button>
         <button class="js-nx" ${i===list.length-1?"disabled":""}>다음 →<b>${i===list.length-1?"—":esc(list[i+1].short||list[i+1].title)}</b></button>
       </div>`;

    $(".js-bk",el).onclick = back;
    const pv=$(".js-pv",el), nx=$(".js-nx",el);
    if(pv && !pv.disabled) pv.onclick = ()=>detail(list, i-1, back, backLabel);
    if(nx && !nx.disabled) nx.onclick = ()=>detail(list, i+1, back, backLabel);

    if(b.live) initLive(el, b.trip);
    if(b.type==="prep") initPrep(el, b);
    if(isSeason) initSeason(el, b);
    if(b.type==="gallery"){
      const gs=$$(".galc", el);
      gs.forEach(g=> g.addEventListener("toggle",()=>{
        if(!g.open) return;
        gs.forEach(o=>{ if(o!==g) o.open=false; });
        if(g.scrollIntoView) g.scrollIntoView({behavior:"smooth",block:"nearest"});
      }));
      $$("[data-spot]", el).forEach(btn=> btn.onclick = e=>{
        e.preventDefault();
        if(window.__spotJump) window.__spotJump(btn.dataset.spot);
      });
    }
    if(isExp){
      const ds = $$("details.exp", el);
      ds.forEach(d=> d.addEventListener("toggle",()=>{
        if(allOpen || !d.open) return;
        ds.forEach(o=>{ if(o!==d) o.open=false; });
      }));
      $$("[data-go]",el).forEach(btn=> btn.onclick = ()=>{
        const t = el.querySelector("#"+btn.dataset.go);
        if(t && t.scrollIntoView) t.scrollIntoView({behavior:"smooth",block:"start"});
      });
      const ea = $(".js-exall",el);
      ea.onclick = ()=>{
        allOpen = !allOpen;
        ds.forEach(d=> d.open = allOpen);

/* ---------- 구글맵 로더 (키가 없으면 오프라인 개념도로 폴백) ---------- */
let __gmState = 0;                 // 0=미시도 1=로딩중 2=성공 3=실패
const __gmQueue = [];
function loadGmaps(cb){
  if(__gmState===2) return cb(true);
  if(__gmState===3) return cb(false);
  __gmQueue.push(cb);
  if(__gmState===1) return;
  const key = ((DATA.maps||{}).apiKey||"").trim();
  if(!key){ __gmState=3; return flushGm(false); }
  __gmState = 1;
  const done = ok => { __gmState = ok?2:3; flushGm(ok); };
  const to = setTimeout(()=>{ if(__gmState===1) done(false); }, 9000);
  window.__gmapReady   = ()=>{ clearTimeout(to); done(true); };
  window.gm_authFailure = ()=>{ clearTimeout(to); done(false); };
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key)
        + "&callback=__gmapReady&language=ko&region=JP";
  s.onerror = ()=>{ clearTimeout(to); done(false); };
  document.head.appendChild(s);
}
function flushGm(ok){ while(__gmQueue.length) __gmQueue.shift()(ok); }

/* ---------- 5) 회화 : 랜딩(검색·즐겨찾기) → 상황별 (표현/퀴즈/대화) ---------- */

/* 즐겨찾기 — 브라우저에 저장되고, 저장이 막힌 환경에서도 세션 동안은 동작 */
const FAV = (function(){
  const KEY="okinawa_guide_fav_v1";
  let set=new Set();
  try{ const raw=localStorage.getItem(KEY); if(raw) set=new Set(JSON.parse(raw)); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify([...set])); }catch(e){} };
  return { has:id=>set.has(id), size:()=>set.size, list:()=>[...set],
           toggle(id){ set.has(id)?set.delete(id):set.add(id); save(); return set.has(id); },
           clear(){ set.clear(); save(); } };
})();

/* TTS — 일본어 음성 선택 · 속도 조절 · 설정 저장 */
const TTS = (function(){
  const KEY="okinawa_guide_tts_v1";
  const ok = typeof window!=="undefined" && "speechSynthesis" in window
             && typeof SpeechSynthesisUtterance!=="undefined";
  /* 자연스러운 순서로 우선순위 (네트워크 음성 > 고품질 내장 > 기본) */
  const PREF=[/google.*(日本語|japanese|ja)/i, /kyoko/i, /o-?ren/i, /nanami/i, /ayumi/i,
              /haruka/i, /hattori/i, /otoya/i, /sayaka/i, /mizuki/i];
  let voices=[], voice=null, rate=0.9;
  let saved={};
  try{ saved=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){}
  if(typeof saved.rate==="number") rate=saved.rate;

  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(
    {voice:voice&&voice.name, rate})); }catch(e){} }

  function load(){
    if(!ok) return;
    try{ voices=(speechSynthesis.getVoices()||[]).filter(v=>/^ja/i.test(v.lang)); }catch(e){ voices=[]; }
    voice=null;
    if(saved.voice) voice=voices.find(v=>v.name===saved.voice)||null;
    if(!voice) for(const re of PREF){ const v=voices.find(x=>re.test(x.name)); if(v){ voice=v; break; } }
    if(!voice) voice=voices[0]||null;
  }
  if(ok){ load(); try{ speechSynthesis.onvoiceschanged=load; }catch(e){} }

  return {
    ok,
    voices:()=>voices,
    current:()=>voice,
    rate:()=>rate,
    setVoice(name){ const v=voices.find(x=>x.name===name); if(v){ voice=v; saved.voice=name; persist(); } },
    setRate(r){ rate=r; persist(); },
    say(text, btn){
      if(!ok) return;
      try{
        speechSynthesis.cancel();
        if(!voice) load();
        const u=new SpeechSynthesisUtterance(text);
        u.lang=(voice&&voice.lang)||"ja-JP";
        u.rate=rate; u.pitch=1; u.volume=1;
        if(voice) u.voice=voice;
        if(btn){ btn.classList.add("play");
          u.onend=u.onerror=()=>btn.classList.remove("play"); }
        speechSynthesis.speak(u);
      }catch(e){}
    }
  };
})();

  /* 즐겨찾기 상자 */
  function renderFav(){

    if(!rows.length){

    $("#favClear").onclick = ()=>{ FAV.clear(); hub(); };

    const sc=$("#favScroll"), pos=$("#favPos"), dots=$("#favDots");
    if(sc){
      const cards = [...sc.querySelectorAll(".ph-card")];
      const maxScroll = ()=> Math.max(0, sc.scrollWidth - sc.clientWidth);
      const sync = ()=>{
        const total = cards.length; if(!total) return;
        const max = maxScroll();
        const r = max>0 ? Math.min(1, Math.max(0, sc.scrollLeft/max)) : 0;
        const n = Math.round(r*(total-1)) + 1;          // 0 → 첫칸, 최대 → 마지막칸
        cur = n-1;
        if(pos) pos.textContent = n + " / " + total;

        const pb=$("#favPrev"), nb=$("#favNext");

      let cur = 0;
      const goTo = k=>{
        const total=cards.length, max=maxScroll();

        if(sc.scrollTo) sc.scrollTo({left, behavior:"smooth"});

        setTimeout(sync, 320);

  /* 퀴즈 */
  function viewQuiz(body,b,reset){

      const pct=Math.round(body.__sc/qs.length*100);

      <div class="dlg-pick">${D.map((d,i)=>
        `<button data-d="${i}"><span class="ic">${d.icon}</span>
           <span><span class="t">${esc(d.title)}</span><br><span class="d">${esc(d.desc||"")}</span></span>
         </button>`).join("")}</div>`;
    $$(".dlg-pick button",body).forEach(x=> x.onclick=()=>runDialog(body,b,+x.dataset.d));
  }

  function runDialog(body,b,idx){
    const D=b.dialogues||[], d=D[idx];
    let step=0, hits=0, tries=0;
    body.innerHTML =
      (D.length>1?`<button class="btn ghost" id="back" style="margin:0 0 12px">← 상황 다시 고르기</button>`:"") +
      `<div class="stage"><div class="place">${d.icon} ${esc(d.title)} ${esc(d.place||"")}</div>
       <div id="log"></div><div id="ctrl"></div></div>`;
    const bk=$("#back"); if(bk) bk.onclick=()=>viewRP(body,b);
    next();

    function bubble(who,jp,ro,ko){
      const log=$("#log"); if(!log) return;              // 화면을 떠났으면 중단
      log.insertAdjacentHTML("beforeend",
        `<div class="bubble ${who==="jp"?"jp-b":"me-b"}">
           <div class="who">${who==="jp"?"상대":"나"}${
             TTS.ok?` <button class="say" data-say="${esc(jp)}">🔊</button>`:""}</div>
           <div class="txt jp">${esc(jp)}</div>
           ${ro?`<div class="ro-s">${esc(ro)}</div>`:""}
           <div class="ko-s">${esc(ko)}</div></div>`);
      const last=$("#log").lastElementChild;
      if(last && last.scrollIntoView) last.scrollIntoView({block:"nearest",behavior:"smooth"});
    }
    function next(){
      const ctrl=$("#ctrl"); if(!ctrl) return;           // 화면을 떠났으면 중단
      ctrl.innerHTML="";
      if(step>=d.lines.length){
        ctrl.innerHTML = `<div class="expl" style="margin-top:16px">
            🎉 대화 완료! ${tries?`선택 정확도 <b>${hits}/${tries}</b>`:""}</div>
          <button class="btn" id="rerun">다시 해보기</button>
          ${D.length>1?`<button class="btn ghost" id="other">다른 상황</button>`:""}`;
        $("#rerun").onclick=()=>runDialog(body,b,idx);
        const o=$("#other"); if(o) o.onclick=()=>viewRP(body,b);
        return;
      }
      const L=d.lines[step];
      if(L.who==="jp" || !L.choices){
        bubble(L.who,L.jp,L.ro,L.ko); step++;
        setTimeout(next, L.who==="jp"?440:340); return;
      }
      ctrl.innerHTML = `<div class="choices"><div class="lbl">🗣 ${esc(L.ask||"뭐라고 답할까요?")}</div>
        ${shuffle(L.choices.map((c,n)=>({c,n}))).map((o,n)=>
          `<button class="opt" data-n="${o.n}"><span class="idx">${"ABCD"[n]}</span>
             <span><span class="jp" style="font-weight:700">${esc(o.c.jp)}</span>
             ${o.c.ro?`<span class="ro-o">${esc(o.c.ro)}</span>`:""}
             <span style="font-size:12.5px;color:var(--ink-3)">${esc(o.c.ko)}</span></span></button>`
        ).join("")}<div id="fb"></div></div>`;
      $$("#ctrl .opt").forEach(btn=> btn.onclick=()=>{
        const ch=L.choices[+btn.dataset.n];
        tries++; if(ch.ok) hits++;
        $$("#ctrl .opt").forEach(x=>{ x.disabled=true;
          if(L.choices[+x.dataset.n].ok) x.classList.add("ok");
          else if(x===btn) x.classList.add("no"); });
        $("#fb").innerHTML = `<div class="fb ${ch.ok?"ok":"no"}">${ch.ok?"⭕️ ":"❌ "}${esc(ch.fb||"")}</div>
          <button class="btn ${ch.ok?"":"coral"}" id="go">계속 →</button>`;
        $("#go").onclick=()=>{ bubble("me",ch.jp,ch.ro||"",ch.ko); step++; next(); };
      });
    }
  }

  hub();
  window.__talkHome = hub;
})();

</script>
</body>
</html>
